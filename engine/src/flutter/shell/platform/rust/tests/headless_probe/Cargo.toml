[package]
name = "flutter-rust-headless-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[dependencies]
flutter-shell-core = { path = "../../crates/flutter-shell-core" }
flutter-shell-wgpu = { path = "../../crates/flutter-shell-wgpu" }
flutter-gpu-queue = { path = "../../crates/flutter-gpu-queue" }

[patch.crates-io]
winit-wayland = { path = "../../third_party/winit-wayland" }
android-activity = { git = "https://github.com/nrbnlulu/android-activity", rev = "10cf552eba323e5c9cd26f6e2619d62050f2395c" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[patch."https://github.com/gfx-rs/wgpu.git"]
wgpu-hal = { path = "../../third_party/wgpu-hal" }
