[package]
name = "rlutter"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "BSD-3-Clause"
description = "Command line tool for building and running Flutter apps on the Rust shell"
publish = false

# Deliberately its own workspace: the engine workspace's Cargo.toml and
# Cargo.lock are copied into every app's SDK directory, so this tool's
# dependencies must not end up in them.
[workspace]

[dependencies]
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = "3.5.2"
flate2 = "1.1.10"
inquire = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
tar = "0.4.46"
ureq = "3.4.2"
which = "8.0.6"
