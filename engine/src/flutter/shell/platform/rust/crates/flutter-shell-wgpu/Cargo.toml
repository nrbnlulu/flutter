[package]
name = "flutter-shell-wgpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Private wgpu Vulkan broker for the Flutter Rust shell"

[lib]
crate-type = ["rlib", "staticlib"]
path = "src/lib.rs"

[dependencies]
flutter-shell-core = { path = "../flutter-shell-core", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
ash = "=0.38.0"
pollster = "=0.4.0"
wgpu = { version = "=30.0.0", default-features = false, features = ["vulkan", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = [
  "rwh_06",
  "wayland",
  "wayland-csd-adwaita",
  "wayland-dlopen",
  "x11",
] }
