[package]
name = "flutter-shell-wgpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Private wgpu Vulkan broker for the Flutter Rust shell"

[lib]
crate-type = ["rlib", "staticlib"]
path = "src/lib.rs"

[dependencies]
flutter-shell-core = { path = "../flutter-shell-core", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
ash = "=0.38.0"
pollster = "=0.4.0"
# crates.io 30.0.0 reuses an unsynchronized acquire fence on Linux. Keep the
# entire upstream wgpu dependency graph coherent by depending on the fixed
# workspace revision: https://github.com/gfx-rs/wgpu/pull/9878
wgpu = { git = "https://github.com/gfx-rs/wgpu.git", rev = "014d9e84813a2946febfa4888694c0b70565b2f5", default-features = false, features = ["vulkan", "wgsl"] }
winit = { version = "=0.31.0-beta.2", default-features = false, features = [
  "wayland",
  "wayland-csd-adwaita",
  "wayland-dlopen",
  "x11",
] }
