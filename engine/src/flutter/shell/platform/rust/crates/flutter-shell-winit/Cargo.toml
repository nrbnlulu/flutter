[package]
name = "flutter-shell-winit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Winit host runtime for the Flutter Rust shell"

[lib]
crate-type = ["rlib", "staticlib"]
path = "src/lib.rs"

[dependencies]
flutter-shell-core = { path = "../flutter-shell-core", version = "0.1.0" }
flutter-shell-wgpu = { path = "../flutter-shell-wgpu", version = "0.1.0" }
log = "=0.4.33"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "=0.6.2"
wayland-sys = { version = "=0.31.11", features = ["client", "dlopen"] }
winit = { version = "=0.30.13", default-features = false, features = [
  "rwh_06",
  "wayland",
  "wayland-csd-adwaita",
  "wayland-dlopen",
  "x11",
] }
x11-dl = "=2.21.0"
