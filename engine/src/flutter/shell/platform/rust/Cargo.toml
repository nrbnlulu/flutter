[workspace]
members = [
  "crates/flutter-gpu-queue",
  "crates/flutter-plugin-sdk",
  "crates/flutter-shell-android-runner",
  "crates/flutter-shell-core",
  "crates/flutter-shell-wgpu",
  "crates/flutter-shell-winit",
]
resolver = "3"

[patch.crates-io]
winit-wayland = { path = "third_party/winit-wayland" }
android-activity = { git = "https://github.com/nrbnlulu/android-activity", rev = "10cf552eba323e5c9cd26f6e2619d62050f2395c" }

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "BSD-3-Clause"

# Flutter's host_debug configuration keeps assertions and debug information,
# but an entirely unoptimized wgpu/Vulkan dependency graph makes multi-view
# rendering CPU-bound long before the GPU is busy.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
