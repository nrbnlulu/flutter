name: Flutter Rust BETA artifacts

on:
  workflow_dispatch:
  push:
    branches: [master, rust/flutter-rs-shell]

permissions:
  contents: write

concurrency:
  group: flutter-rust-beta
  cancel-in-progress: true

jobs:
  build-tool:
    runs-on: ubuntu-latest
    outputs:
      flutter_version_tag: ${{ steps.import-tags.outputs.flutter_version_tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Import Flutter version tags
        id: import-tags
        env:
          FLUTTER_UPSTREAM_URL: https://github.com/flutter/flutter.git
        run: |
          git fetch --force "$FLUTTER_UPSTREAM_URL" 'refs/tags/*:refs/tags/*'
          FLUTTER_VERSION_TAG=$(git for-each-ref \
            --sort=-v:refname \
            --count=1 \
            --format='%(refname:short)' \
            'refs/tags/[0-9]*.*.*')
          if [[ -z "$FLUTTER_VERSION_TAG" ]]; then
            echo 'No numeric Flutter version tag was fetched.' >&2
            exit 1
          fi
          if ! git merge-base "$GITHUB_SHA" "$FLUTTER_VERSION_TAG" >/dev/null; then
            echo "Flutter version tag $FLUTTER_VERSION_TAG has no common ancestor with $GITHUB_SHA." >&2
            exit 1
          fi
          echo "FLUTTER_VERSION_TAG=$FLUTTER_VERSION_TAG" >> "$GITHUB_ENV"
          echo "flutter_version_tag=$FLUTTER_VERSION_TAG" >> "$GITHUB_OUTPUT"

      - name: Refresh the pinned engine.version
        env:
          GH_TOKEN: ${{ secrets.FLUTTER_RUST_RELEASE_TOKEN }}
        run: |
          # bin/internal/engine.version is checked into this branch (see
          # "Make the BETA SDK installable through FVM") so that
          # update_engine_version.sh always resolves a pinned, downloadable
          # Dart SDK/engine instead of a content-aware hash unique to this
          # fork's engine/ changes, which has no published artifacts.
          #
          # The value is NOT a git commit SHA: it is the content-addressed
          # hash (content_aware_hash.sh's output, hashing DEPS + engine/)
          # that Google's build infra keys published artifacts under. Only
          # upstream flutter/flutter's own release branches (stable/beta)
          # are guaranteed to have that hash actually published, so pull it
          # from there rather than computing/guessing one, and take
          # upstream's beta channel to minimize drift against this fork's
          # frequent merges. A stale pin here means the Dart SDK used to
          # compile a kernel locally drifts from the SDK baked into the
          # freshly built libflutter_rust_engine.so, and the app fails to
          # launch with "Invalid SDK hash".
          NEW_ENGINE_VERSION="$(curl -fsSL \
            https://raw.githubusercontent.com/flutter/flutter/beta/bin/internal/engine.version)"
          if [[ -z "$NEW_ENGINE_VERSION" ]]; then
            echo 'Could not fetch upstream beta engine.version.' >&2
            exit 1
          fi
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://storage.googleapis.com/flutter_infra_release/flutter/${NEW_ENGINE_VERSION}/engine_stamp.json")"
          if [[ "$STATUS" != "200" ]]; then
            echo "Upstream beta engine.version ($NEW_ENGINE_VERSION) has no published artifacts (HTTP $STATUS)." >&2
            exit 1
          fi
          CURRENT_ENGINE_VERSION="$(cat bin/internal/engine.version 2>/dev/null || true)"
          if [[ "$NEW_ENGINE_VERSION" == "$CURRENT_ENGINE_VERSION" ]]; then
            echo "engine.version already up to date ($NEW_ENGINE_VERSION)."
          else
            echo "$NEW_ENGINE_VERSION" > bin/internal/engine.version
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add bin/internal/engine.version
            git commit -m "Roll pinned engine.version to $NEW_ENGINE_VERSION"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Add Flutter to PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Build Flutter tool
        run: |
          bin/flutter --version
          bin/flutter precache --linux
          if grep -q '"frameworkVersion": "0.0.0-unknown"' bin/cache/flutter.version.json; then
            echo 'Flutter could not derive a version from the imported tag.' >&2
            exit 1
          fi
          bin/cache/dart-sdk/bin/dart .agents/skills/rebuilding-flutter-tool/scripts/rebuild.dart

      - name: Package standalone Flutter SDK
        run: |
          # Preserve git metadata for bin/flutter's revision checks, and the
          # bootstrapped tool + full Dart SDK. No FVM or global Flutter needed.
          sdk="$RUNNER_TEMP/rlutter-flutter"
          git clone --no-local --single-branch "$GITHUB_WORKSPACE" "$sdk"
          git -C "$sdk" fetch --depth 1 "$GITHUB_WORKSPACE" \
            "refs/tags/$FLUTTER_VERSION_TAG:refs/tags/$FLUTTER_VERSION_TAG"
          git -C "$sdk" remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          rm -rf "$sdk/engine"
          cp -a bin/cache "$sdk/bin/"
          # Avoid recompiling the tool just because extraction reorders mtimes.
          touch "$sdk/packages/flutter_tools/pubspec.lock"
          tar -C "$sdk" -czf "$RUNNER_TEMP/rlutter-flutter-linux-x64.tar.gz" .

      - name: Upload standalone Flutter SDK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: rlutter-flutter-sdk
          path: ${{ runner.temp }}/rlutter-flutter-linux-x64.tar.gz
          retention-days: 1

      - name: Upload Flutter tool snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: flutter-tools-snapshot
          path: bin/cache/flutter_tools.snapshot
          retention-days: 1

  build-engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime_mode: [debug, profile, release]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan-dev libwayland-dev libxkbcommon-dev ninja-build
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch engine dependencies
        run: |
          cp engine.gclient .gclient
          "$RUNNER_TEMP/depot_tools/gclient" sync --no-history

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal

      - name: Configure Flutter engine (${{ matrix.runtime_mode }})
        working-directory: engine/src
        env:
          VPYTHON_BYPASS: manually managed python not supported by chrome operations
        # --enable-fontconfig: without it Skia's directory font manager has no
        # per-character fallback, so emoji and CJK render as missing glyphs.
        run: flutter/tools/gn --runtime-mode ${{ matrix.runtime_mode }} --no-goma --enable-fontconfig

      - name: Build Rust shell (${{ matrix.runtime_mode }})
        working-directory: engine/src
        env:
          VPYTHON_BYPASS: manually managed python not supported by chrome operations
        run: |
          # The engine's embedded Dart VM only accepts kernels compiled by a
          # frontend_server built from the identical source tree (anything
          # else fails at launch with "Invalid SDK hash"), so build the
          # kernel compiler pieces in the same ninja invocation as the
          # engine, and ship them with it.
          ninja -C out/host_${{ matrix.runtime_mode }} \
            flutter_rust_shell_runner libflutter_rust_engine.so \
            flutter_patched_sdk dart-sdk gen_snapshot font-subset impellerc libtessellator.so \
            flutter/sky/packages/sky_engine:sky_engine \
            flutter/flutter_frontend_server:frontend_server

      - name: Verify display-free Linux rendering, host, agent and video
        if: matrix.runtime_mode == 'debug'
        env:
          FLUTTER_WINDOWING: 'true'
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          WGPU_VALIDATION: '1'
        run: |
          sudo apt-get install --yes mesa-vulkan-drivers vulkan-validationlayers strace ffmpeg libfontconfig1
          unset DISPLAY WAYLAND_DISPLAY
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name '*lvp*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          python3 tools/rust_shell/tasks.py headless-unit
          for gate in render host agent recording; do
            python3 tools/rust_shell/tasks.py "headless-$gate" \
              --artifacts "build/headless-$gate"
          done

      - name: Retain headless evidence
        if: always() && matrix.runtime_mode == 'debug'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: rust-headless-evidence
          path: build/headless-*
          retention-days: 7

      - name: Package engine artifacts (${{ matrix.runtime_mode }})
        working-directory: engine/src
        run: |
          flutter/shell/platform/rust/tools/package_engine_artifacts.sh \
            out/host_${{ matrix.runtime_mode }} \
            "$RUNNER_TEMP/engine-package"

      - name: Upload engine build (${{ matrix.runtime_mode }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: rust-engine-${{ matrix.runtime_mode }}
          path: ${{ runner.temp }}/engine-package
          retention-days: 1

  build-android-engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime_mode: [debug, release]
        # One entry per ABI in rlutter's SUPPORTED_ABIS (abi.rs).
        android_cpu: [arm64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan-dev libwayland-dev libxkbcommon-dev ninja-build
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch engine dependencies (with the Android NDK and sysroot)
        run: |
          sed 's/"download_android_deps": False/"download_android_deps": True/' engine.gclient > .gclient
          grep -q '"download_android_deps": True' .gclient
          "$RUNNER_TEMP/depot_tools/gclient" sync --no-history

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal

      - name: Configure Android engine (${{ matrix.runtime_mode }}, ${{ matrix.android_cpu }})
        working-directory: engine/src
        env:
          VPYTHON_BYPASS: manually managed python not supported by chrome operations
        # Debug is unoptimized, like the local android_debug_unopt_* builds
        # rlutter already supports.
        run: |
          flags=()
          if [[ "${{ matrix.runtime_mode }}" == debug ]]; then flags+=(--unoptimized); fi
          flutter/tools/gn --android --android-cpu ${{ matrix.android_cpu }} \
            --runtime-mode ${{ matrix.runtime_mode }} --no-goma "${flags[@]}"

      - name: Build Android engine (${{ matrix.runtime_mode }}, ${{ matrix.android_cpu }})
        working-directory: engine/src
        env:
          VPYTHON_BYPASS: manually managed python not supported by chrome operations
        run: |
          out="$(ls -d out/android_${{ matrix.runtime_mode }}*_${{ matrix.android_cpu }})"
          echo "ANDROID_OUT=$out" >> "$GITHUB_ENV"
          # Android has no flutter_patched_sdk archive target. Build the
          # platform dill files copied by package_android_engine_artifacts.sh.
          targets=(flutter/shell/platform/android:android_jar
                   flutter/shell/platform/android:pom_embedding
                   flutter/shell/platform/android:pom_libflutter
                   flutter/lib/snapshot:strong_platform)
          # Release apps are AOT-compiled by the host-run gen_snapshot for
          # this target; debug ones use the snapshots linked into the engine.
          if [[ "${{ matrix.runtime_mode }}" == release ]]; then
            targets+=(clang_x64/gen_snapshot)
          fi
          ninja -C "$out" "${targets[@]}"

      - name: Package Android engine artifacts (${{ matrix.runtime_mode }}, ${{ matrix.android_cpu }})
        working-directory: engine/src
        run: |
          flutter/shell/platform/rust/tools/package_android_engine_artifacts.sh \
            "$ANDROID_OUT" "$RUNNER_TEMP/android-engine-package"

      - name: Upload Android engine build (${{ matrix.runtime_mode }}, ${{ matrix.android_cpu }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: rust-engine-android-${{ matrix.android_cpu }}-${{ matrix.runtime_mode }}
          path: ${{ runner.temp }}/android-engine-package
          retention-days: 1

  agent-protocol-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check offline package audit boundaries before engine sync
        run: |
          python -m pip install PyYAML==6.0.2
          python engine/src/flutter/tools/pub_get_offline_test.py
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal
      - name: Test protocol, semantics, codecs and PNGs without a GPU
        run: cargo +1.93.1 test --locked --manifest-path engine/src/flutter/shell/platform/rust/Cargo.toml -p flutter-shell-agent -p flutter-shell-core -p flutter-gpu-queue

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        runtime_mode: [debug, release]
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      DEPOT_TOOLS_UPDATE: '0'
      GYP_MSVS_VERSION: '2022'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Configure Windows build tools
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          "GYP_MSVS_OVERRIDE_PATH=$vs" >> $env:GITHUB_ENV
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$env:RUNNER_TEMP/depot_tools"
          "$env:RUNNER_TEMP/depot_tools" >> $env:GITHUB_PATH
          "DEPOT_TOOLS=$env:RUNNER_TEMP/depot_tools" >> $env:GITHUB_ENV
          rustup toolchain install 1.93.1 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Engine scripts call python3 through cmd.exe; avoid the Store alias.
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/python-shim" | Out-Null
          $python = (Get-Command python.exe).Source
          "@echo off`n`"$python`" %*" | Set-Content "$env:RUNNER_TEMP/python-shim/python3.cmd"
          "$env:RUNNER_TEMP/python-shim" >> $env:GITHUB_PATH

      - name: Fetch matching engine dependencies
        shell: pwsh
        run: |
          Copy-Item engine.gclient .gclient
          gclient sync --no-history
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python engine/src/flutter/tools/pub_get_offline_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python engine/src/flutter/tools/githooks/setup_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python engine/src/flutter/tools/git_version_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build and package the matching engine
        shell: pwsh
        run: |
          python tools/rust_shell/tasks.py build --engine host_${{ matrix.runtime_mode }} --mode ${{ matrix.runtime_mode }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/rust_shell/package_windows_sdk.py engine engine/src/out/host_${{ matrix.runtime_mode }} build/windows-engine
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload Windows engine
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: windows-engine-${{ matrix.runtime_mode }}
          path: build/windows-engine
          retention-days: 1

  package-windows:
    needs: [build-windows, build-tool]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Re-fetch the resolved Flutter version tag
        env:
          FLUTTER_VERSION_TAG: ${{ needs.build-tool.outputs.flutter_version_tag }}
        run: |
          git fetch --force https://github.com/flutter/flutter.git "refs/tags/${env:FLUTTER_VERSION_TAG}:refs/tags/${env:FLUTTER_VERSION_TAG}"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "FLUTTER_VERSION_TAG=$env:FLUTTER_VERSION_TAG" >> $env:GITHUB_ENV

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal

      - name: Download Windows debug engine
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-engine-debug
          path: build/windows-engines/debug

      - name: Download Windows release engine
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-engine-release
          path: build/windows-engines/release

      - name: Package the Windows Rust SDK
        run: python tools/rust_shell/package_windows_sdk.py bundle . build/windows-engines build/windows-sdk build/flutter-rust-windows-x64.tar.gz

      - name: Test rlutter and bootstrap the standalone Flutter SDK
        shell: pwsh
        run: |
          cargo +1.93.1 test --locked --manifest-path engine/src/flutter/shell/platform/rust/rlutter/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.93.1 build --release --locked --manifest-path engine/src/flutter/shell/platform/rust/rlutter/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bin/flutter.bat --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/rust_shell/package_windows_sdk.py flutter . "$env:RUNNER_TEMP/windows-flutter" build/rlutter-flutter-windows-x64.tar.gz --version-tag $env:FLUTTER_VERSION_TAG
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify packaged SDKs without checkout engine links
        shell: pwsh
        run: |
          $env:XDG_CACHE_HOME = "$env:RUNNER_TEMP/windows-managed-cache"
          $cache = "$env:XDG_CACHE_HOME/rlutter/flutter-BETA"
          New-Item -ItemType Directory -Force $cache | Out-Null
          tar -xzf build/rlutter-flutter-windows-x64.tar.gz -C $cache
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Set-Content "$cache/.rlutter-complete" 'BETA'
          $cli = "$env:GITHUB_WORKSPACE/engine/src/flutter/shell/platform/rust/rlutter/target/release/rlutter.exe"
          $project = "$env:RUNNER_TEMP/windows-standalone-smoke"
          New-Item -ItemType Directory -Force "$project/.dart_tool/flutter_rs/sdk" | Out-Null
          tar -xzf build/flutter-rust-windows-x64.tar.gz -C "$project/.dart_tool/flutter_rs/sdk"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location $project
          & $cli create . --project-name windows_standalone_smoke
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $cli build windows --debug
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $cli build windows --release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (!(Test-Path runner-rs/target/release/data/flutter_assets/app.so)) { throw 'No AOT app.so' }
          Pop-Location

      - name: Upload Windows distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: windows-distribution
          path: |
            build/flutter-rust-windows-x64.tar.gz
            build/rlutter-flutter-windows-x64.tar.gz
            engine/src/flutter/shell/platform/rust/rlutter/target/release/rlutter.exe
          retention-days: 1

  publish:
    needs: [build-tool, build-engine, build-android-engine, package-windows, agent-protocol-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Re-fetch the resolved Flutter version tag
        env:
          FLUTTER_UPSTREAM_URL: https://github.com/flutter/flutter.git
          FLUTTER_VERSION_TAG: ${{ needs.build-tool.outputs.flutter_version_tag }}
        run: |
          git fetch --force "$FLUTTER_UPSTREAM_URL" "refs/tags/$FLUTTER_VERSION_TAG:refs/tags/$FLUTTER_VERSION_TAG"
          echo "FLUTTER_VERSION_TAG=$FLUTTER_VERSION_TAG" >> "$GITHUB_ENV"

      - name: Download Flutter tool snapshot
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: flutter-tools-snapshot
          path: build

      - name: Download standalone Flutter SDK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rlutter-flutter-sdk
          path: build

      - name: Download debug engine build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rust-engine-debug
          path: build/flutter-rust-sdk/lib/debug

      - name: Download release engine build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rust-engine-release
          path: build/flutter-rust-sdk/lib/release

      - name: Download profile engine build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rust-engine-profile
          path: build/flutter-rust-sdk/lib/profile

      - name: Download Android engine builds
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: rust-engine-android-*
          path: build/downloaded-android-engines

      - name: Download Windows distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-distribution
          path: build/windows-distribution

      - name: Package BETA assets
        run: |
          python3 engine/src/flutter/shell/platform/rust/tools/package_sdk_sources.py \
            build/flutter-rust-sdk --validate-engines
          find build/windows-distribution -name '*.tar.gz' -exec cp {} build/ \;
          find build/windows-distribution -name rlutter.exe -exec cp {} build/ \;
          for mode in debug profile release; do
            lib="build/flutter-rust-sdk/lib/$mode"
            chmod +x "$lib/flutter_rust_shell_runner" "$lib/gen_snapshot" "$lib/font-subset" \
              "$lib/dart-sdk/bin/dart" "$lib/dart-sdk/bin/dartaotruntime" "$lib/impellerc"
            find "$lib/dart-sdk/bin" -type f ! -path '*/snapshots/*' -exec chmod +x {} +
          done
          tar -C build/flutter-rust-sdk -czf build/flutter-rust-linux-x64.tar.gz .
          # One archive per Android ABI, laid out as <mode>/ like the Linux
          # bundle's lib/<mode>/. rlutter downloads
          # flutter-rust-<flutter TargetPlatform>.tar.gz on demand.
          for dir in build/downloaded-android-engines/rust-engine-android-*-*; do
            name="$(basename "$dir")"   # rust-engine-android-<cpu>-<mode>
            mode="${name##*-}"
            cpu="${name#rust-engine-android-}"; cpu="${cpu%-*}"
            mkdir -p "build/android-$cpu/$mode"
            cp -R "$dir/." "build/android-$cpu/$mode/"
            chmod +x "build/android-$cpu/$mode/clang_x64/gen_snapshot" 2>/dev/null || true
          done
          for dir in build/android-*/; do
            cpu="$(basename "$dir")"    # android-<cpu>
            tar -C "$dir" -czf "build/flutter-rust-$cpu.tar.gz" .
          done
          mv build/flutter_tools.snapshot build/flutter-tools.snapshot
          sha256sum build/flutter-rust-*.tar.gz build/rlutter-flutter-*.tar.gz build/rlutter.exe build/flutter-tools.snapshot > build/SHA256SUMS

      - name: Verify standalone SDK without a Flutter installation
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan-dev libwayland-dev libxkbcommon-dev mesa-vulkan-drivers vulkan-validationlayers ffmpeg strace libfontconfig1
          rustup toolchain install 1.93.1 --profile minimal
          cargo +1.93.1 build --release --locked \
            --manifest-path engine/src/flutter/shell/platform/rust/rlutter/Cargo.toml
          rlutter="$GITHUB_WORKSPACE/engine/src/flutter/shell/platform/rust/rlutter/target/release/rlutter"
          export XDG_CACHE_HOME="$RUNNER_TEMP/standalone-cache"
          unset FLUTTER_ROOT
          mkdir -p "$XDG_CACHE_HOME/rlutter/flutter-BETA"
          tar -xzf build/rlutter-flutter-linux-x64.tar.gz -C "$XDG_CACHE_HOME/rlutter/flutter-BETA"
          touch "$XDG_CACHE_HOME/rlutter/flutter-BETA/.rlutter-complete"
          # Fail if rlutter ever tries PATH discovery again.
          mkdir -p "$RUNNER_TEMP/no-flutter"
          printf '#!/bin/sh\necho "Unexpected global Flutter invocation" >&2\nexit 1\n' > "$RUNNER_TEMP/no-flutter/flutter"
          chmod +x "$RUNNER_TEMP/no-flutter/flutter"
          export PATH="$RUNNER_TEMP/no-flutter:$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
          unset DISPLAY WAYLAND_DISPLAY
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name '*lvp*.json' -print -quit)"
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          test -n "$VK_DRIVER_FILES"
          python3 "$GITHUB_WORKSPACE/engine/src/flutter/shell/platform/rust/tests/test_packaged_agent.py" \
            --rlutter "$rlutter" \
            --flutter-archive "$GITHUB_WORKSPACE/build/rlutter-flutter-linux-x64.tar.gz" \
            --rust-archive "$GITHUB_WORKSPACE/build/flutter-rust-linux-x64.tar.gz" \
            --artifacts "$RUNNER_TEMP/packaged-agent-evidence"
          cd "$RUNNER_TEMP"
          mkdir -p standalone_smoke
          cd standalone_smoke
          # Test the exact packaged sources/engines, without a network download
          # of the previous rolling release or a link into the CI checkout.
          mkdir -p .dart_tool/flutter_rs/sdk
          tar -xzf "$GITHUB_WORKSPACE/build/flutter-rust-linux-x64.tar.gz" -C .dart_tool/flutter_rs/sdk
          "$rlutter" create . --project-name standalone_smoke
          "$rlutter" build linux
          test -f runner-rs/target/debug/data/flutter_assets/kernel_blob.bin
          "$rlutter" build linux --profile
          test -f runner-rs/target/flutter-profile/data/flutter_assets/app.so
          "$rlutter" build linux --release
          test -f runner-rs/target/release/data/flutter_assets/app.so

          cp .dart_tool/flutter_rs/sdk/tests/agent_fixture/lib/main.dart lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          spec = Path('pubspec.yaml')
          spec.write_text(spec.read_text().replace('dependencies:\n',
              'dependencies:\n  flutter_rust_agent:\n    path: .dart_tool/flutter_rs/sdk/dart/flutter_rust_agent\n', 1))
          PY
          python3 "$GITHUB_WORKSPACE/engine/src/flutter/shell/platform/rust/tests/test_verify.py" \
            --rlutter "$rlutter" --flutter-root "$XDG_CACHE_HOME/rlutter/flutter-BETA" \
            --project "$PWD" --artifacts "$RUNNER_TEMP/packaged-agent-controls"

          # Exercise the Android archives exactly as a release user receives
          # them, including Flutter's Java plugin loader and JNI libraries.
          rustup target add aarch64-linux-android --toolchain 1.93.1
          # PATH was reset above, so locate sdkmanager via the runner's SDK root.
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$android_sdk" ANDROID_SDK_ROOT="$android_sdk"
          yes | "$android_sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$android_sdk/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "ndk;28.2.13676358"
          mkdir -p .dart_tool/flutter_rs/sdk/lib/android-arm64
          tar -xzf "$GITHUB_WORKSPACE/build/flutter-rust-android-arm64.tar.gz" \
            -C .dart_tool/flutter_rs/sdk/lib/android-arm64
          "$XDG_CACHE_HOME/rlutter/flutter-BETA/bin/flutter" pub add \
            shared_preferences path_provider
          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            final preferences = SharedPreferencesAsync();
            await preferences.setString('probe', 'ok');
            final path = await getApplicationSupportDirectory();
            runApp(MaterialApp(home: Text('${await preferences.getString('probe')} ${path.path}')));
          }
          DART
          "$rlutter" build android --debug
          "$rlutter" build android --release
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          for mode in ('debug', 'release'):
              apk = Path(f'android-rs/app/build/outputs/apk/{mode}/app-{mode}.apk')
              with ZipFile(apk) as archive:
                  names = set(archive.namelist())
                  dex = b''.join(archive.read(name) for name in names
                                 if name.startswith('classes') and name.endswith('.dex'))
              required = {
                  'lib/arm64-v8a/libflutter.so',
                  'lib/arm64-v8a/libstandalone_smoke.so',
                  'lib/arm64-v8a/libdartjni.so',
              }
              if mode == 'debug':
                  required.add('assets/flutter_assets/kernel_blob.bin')
                  for plugin in (b'JniPlugin', b'JniFlutterPlugin', b'SharedPreferencesPlugin'):
                      assert plugin in dex, (mode, plugin)
              else:
                  required.add('lib/arm64-v8a/libapp.so')
              assert required <= names, (mode, sorted(required - names))
              assert 'lib/arm64-v8a/libflutter_rust_engine.so' not in names
          PY

      - name: Retain packaged verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: rust-packaged-agent-evidence
          path: |
            ${{ runner.temp }}/packaged-agent-evidence
            ${{ runner.temp }}/packaged-agent-controls
          retention-days: 7

      - name: Publish rolling BETA release
        env:
          GH_TOKEN: ${{ secrets.FLUTTER_RUST_RELEASE_TOKEN }}
        run: |
          gh auth setup-git
          git push --no-verify origin \
            "refs/tags/${FLUTTER_VERSION_TAG}:refs/tags/${FLUTTER_VERSION_TAG}"
          {
            echo 'Rolling Flutter Rust shell SDK artifacts.'
            echo
            echo 'Install rlutter (downloads this SDK when needed):'
            echo
            echo 'Linux:'
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/rust/flutter-rs-shell/engine/src/flutter/shell/platform/rust/install.sh | sh"
            echo '```'
            echo
            echo 'Windows (PowerShell; uses gh when available):'
            echo
            echo '```powershell'
            echo "irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/rust/flutter-rs-shell/engine/src/flutter/shell/platform/rust/install.ps1 | iex"
            echo '```'
          } > notes.md
          if gh release view BETA >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/BETA" \
              -f sha="${GITHUB_SHA}" \
              -F force=true
            gh release edit BETA --notes-file notes.md
          else
            gh release create BETA --prerelease --title "Flutter Rust BETA" \
              --target "${GITHUB_SHA}" \
              --notes-file notes.md
          fi
          gh release upload BETA \
            build/flutter-rust-*.tar.gz \
            build/flutter-tools.snapshot \
            build/rlutter-flutter-*.tar.gz \
            build/rlutter.exe \
            build/SHA256SUMS \
            --clobber
