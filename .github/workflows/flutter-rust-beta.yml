name: Flutter Rust BETA artifacts

on:
  push:
    branches: [master, rust/flutter-rs-shell]

permissions:
  contents: write

concurrency:
  group: flutter-rust-beta
  cancel-in-progress: true

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Import Flutter version tags
        env:
          FLUTTER_UPSTREAM_URL: https://github.com/flutter/flutter.git
        run: |
          git fetch --force "$FLUTTER_UPSTREAM_URL" 'refs/tags/*:refs/tags/*'
          FLUTTER_VERSION_TAG=$(git for-each-ref \
            --sort=-v:refname \
            --count=1 \
            --format='%(refname:short)' \
            'refs/tags/[0-9]*.*.*')
          if [[ -z "$FLUTTER_VERSION_TAG" ]]; then
            echo 'No numeric Flutter version tag was fetched.' >&2
            exit 1
          fi
          if ! git merge-base "$GITHUB_SHA" "$FLUTTER_VERSION_TAG" >/dev/null; then
            echo "Flutter version tag $FLUTTER_VERSION_TAG has no common ancestor with $GITHUB_SHA." >&2
            exit 1
          fi
          echo "FLUTTER_VERSION_TAG=$FLUTTER_VERSION_TAG" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan-dev libwayland-dev libxkbcommon-dev ninja-build
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"

      - name: Add Flutter to PATH
        run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Fetch engine dependencies
        run: |
          cp engine.gclient .gclient
          "$RUNNER_TEMP/depot_tools/gclient" sync --no-history

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal

      - name: Build Flutter tool
        run: |
          bin/flutter --version
          if grep -q '"frameworkVersion": "0.0.0-unknown"' bin/cache/flutter.version.json; then
            echo 'Flutter could not derive a version from the imported tag.' >&2
            exit 1
          fi
          bin/cache/dart-sdk/bin/dart .agents/skills/rebuilding-flutter-tool/scripts/rebuild.dart

      - name: Configure Flutter engine
        working-directory: engine/src
        env:
          VPYTHON_BYPASS: manually managed python not supported by chrome operations
        run: flutter/tools/gn --runtime-mode debug --no-goma

      - name: Build Rust shell
        working-directory: engine/src
        env:
          VPYTHON_BYPASS: manually managed python not supported by chrome operations
        run: ninja -C out/host_debug flutter_rust_shell_runner libflutter_rust_engine.so

      - name: Package BETA assets
        run: |
          mkdir -p build/flutter-rust-sdk/crates build/flutter-rust-sdk/third_party build/flutter-rust-sdk/lib
          cp engine/src/flutter/shell/platform/rust/Cargo.toml build/flutter-rust-sdk/
          cp engine/src/flutter/shell/platform/rust/Cargo.lock build/flutter-rust-sdk/
          cp -R engine/src/flutter/shell/platform/rust/crates/. build/flutter-rust-sdk/crates/
          cp -R engine/src/flutter/shell/platform/rust/third_party/winit-wayland build/flutter-rust-sdk/third_party/
          cp engine/src/out/host_debug/libflutter_rust_engine.so build/flutter-rust-sdk/lib/
          cp engine/src/out/host_debug/flutter_rust_shell_runner build/flutter-rust-sdk/lib/
          cp engine/src/out/host_debug/icudtl.dat build/flutter-rust-sdk/lib/
          tar -C build/flutter-rust-sdk -czf build/flutter-rust-linux-x64.tar.gz .
          cp bin/cache/flutter_tools.snapshot build/flutter-tools.snapshot
          sha256sum build/flutter-rust-linux-x64.tar.gz build/flutter-tools.snapshot > build/SHA256SUMS

      - name: Publish rolling BETA release
        env:
          GH_TOKEN: ${{ secrets.FLUTTER_RUST_RELEASE_TOKEN }}
        run: |
          gh auth setup-git
          git push --no-verify origin \
            "refs/tags/${FLUTTER_VERSION_TAG}:refs/tags/${FLUTTER_VERSION_TAG}"
          if gh release view BETA >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/BETA" \
              -f sha="${GITHUB_SHA}" \
              -F force=true
          else
            gh release create BETA --prerelease --title "Flutter Rust BETA" \
              --target "${GITHUB_SHA}" \
              --notes "Rolling artifacts built from the latest merged revision on master."
          fi
          gh release upload BETA \
            build/flutter-rust-linux-x64.tar.gz \
            build/flutter-tools.snapshot \
            build/SHA256SUMS \
            --clobber
