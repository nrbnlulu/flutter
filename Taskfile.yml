version: "3"

vars:
  PYTHON: '{{if eq OS "windows"}}python{{else}}python3{{end}}'
  LOCAL_ENGINE: host_debug
  RUST_SHELL_SAMPLE: '{{.TASKFILE_DIR}}/engine/src/flutter/shell/platform/rust/tests/smoke_fixture'
  RUST_WINDOWING_EXAMPLE: '{{.TASKFILE_DIR}}/examples/multiple_windows'
  RUST_TEXTURE_EXAMPLE: '{{.TASKFILE_DIR}}/examples/texture'
  RESIZE_ITERATIONS: 500
  LIFECYCLE_ITERATIONS: 20
  TEXTURE_LIFECYCLE_ITERATIONS: 40
  ANDROID_ENGINE: android_debug_unopt_arm64
  ANDROID_GRADLE_TASK: assembleDebug
  RUST_TASK: >-
    {{.PYTHON}} "{{.TASKFILE_DIR}}/tools/rust_shell/tasks.py"

env:
  LOCAL_ENGINE: '{{.LOCAL_ENGINE}}'
  RUST_SHELL_SAMPLE: '{{.RUST_SHELL_SAMPLE}}'
  RUST_WINDOWING_EXAMPLE: '{{.RUST_WINDOWING_EXAMPLE}}'
  RUST_TEXTURE_EXAMPLE: '{{.RUST_TEXTURE_EXAMPLE}}'
  RESIZE_ITERATIONS: '{{.RESIZE_ITERATIONS}}'
  LIFECYCLE_ITERATIONS: '{{.LIFECYCLE_ITERATIONS}}'
  TEXTURE_LIFECYCLE_ITERATIONS: '{{.TEXTURE_LIFECYCLE_ITERATIONS}}'
  ANDROID_ENGINE: '{{.ANDROID_ENGINE}}'
  ANDROID_GRADLE_TASK: '{{.ANDROID_GRADLE_TASK}}'

# All process control, environment setup, platform selection, and assertions
# live in Python. Override paths/iteration counts with task variables as before.
tasks:
  fmt:
    desc: Format changed engine files and Rust shell crates.
    cmds:
      - task: fmt-engine
      - task: fmt-rust

  fmt-engine:
    desc: Format changed engine files.
    cmds:
      - >-
        {{.RUST_TASK}} fmt-engine

  fmt-rust:
    desc: Format Rust shell crates and rlutter.
    cmds:
      - >-
        {{.RUST_TASK}} fmt-rust

  build-rlutter:
    desc: Build the rlutter CLI.
    cmds:
      - >-
        {{.RUST_TASK}} build-rlutter

  install-rlutter:
    desc: Install rlutter into Cargo bin.
    cmds:
      - >-
        {{.RUST_TASK}} install-rlutter

  test-rlutter:
    desc: Run rlutter tests and Clippy.
    cmds:
      - >-
        {{.RUST_TASK}} test-rlutter

  test-rlutter-e2e:
    desc: Create and build a native project and verify its bundle.
    deps: [build-rust-shell, build-rlutter]
    cmds:
      - >-
        {{.RUST_TASK}} rlutter-e2e

  fix-rust-lints:
    desc: Apply Rust Clippy fixes.
    cmds:
      - >-
        {{.RUST_TASK}} fix-rust-lints

  push:
    desc: Push Git changes with depot_tools on PATH.
    cmds:
      - >-
        {{.RUST_TASK}} push

  build-rust-shell:
    desc: Build the native debug engine and Dart tools.
    cmds:
      - >-
        {{.RUST_TASK}} build

  build-rust-shell-release:
    desc: Build the native release engine and Dart tools.
    cmds:
      - >-
        {{.RUST_TASK}} build --engine host_release --mode release

  build-rust-shell-profile:
    desc: Build the native profile engine and Dart tools.
    cmds:
      - >-
        {{.RUST_TASK}} build --engine host_profile --mode profile

  configure-rust-shell-fontconfig:
    desc: Configure the native engine and Linux font fallback.
    cmds:
      - >-
        {{.RUST_TASK}} configure

  build-android-shell:
    desc: Build the FlutterActivity engine and Java embedding.
    cmds:
      - >-
        {{.RUST_TASK}} build-android

  build-android-shell-apk:
    desc: Build the Android shell APK.
    deps: [build-android-shell]
    cmds:
      - >-
        {{.RUST_TASK}} android-apk

  run-rust-multiple-windows:
    desc: Build and run the native multiple-window example.
    deps: [build-rust-shell]
    cmds:
      - >-
        {{.RUST_TASK}} run
        --target "{{.TARGET | default "lib/main.dart"}}"

  run-rust-hebrew:
    desc: Run the Hebrew/English text playground.
    deps: [build-rust-shell]
    cmds:
      - >-
        {{.RUST_TASK}} run --target lib/hebrew_main.dart

  test-rust-shell-windowing:
    desc: Validate native multi-view creation, resizing, and release.
    deps: [build-rust-shell]
    cmds:
      - >-
        {{.RUST_TASK}} windowing

  benchmark-rust-shell-windowing:
    desc: Collect multi-view performance evidence.
    deps: [build-rust-shell]
    cmds:
      - >-
        {{.RUST_TASK}} benchmark
        {{.CLI_ARGS}}

  test-rust-shell-texture:
    desc: Validate animated wgpu texture pixels.
    deps: [build-rust-shell]
    cmds:
      - >-
        {{.RUST_TASK}} texture

  test-rust-shell-pixel-buffer-texture:
    desc: Validate animated pixel-buffer texture pixels.
    deps: [build-rust-shell]
    cmds:
      - >-
        {{.RUST_TASK}} pixel-buffer

  test-rust-shell-texture-lifecycle:
    desc: Stress texture replacement and reclamation.
    deps: [build-rust-shell]
    cmds:
      - >-
        {{.RUST_TASK}} texture-lifecycle

  test-rust-shell-frb-dispatch:
    desc: Validate FRB isolate dispatch and both texture producers.
    deps: [build-rust-shell]
    cmds:
      - >-
        {{.RUST_TASK}} frb

  test-rust-shell-lifecycle:
    desc: Validate repeated native startup and clean close.
    deps: [build-rust-shell]
    cmds:
      - >-
        {{.RUST_TASK}} lifecycle

  stress-rust-shell:
    desc: Validate input/resize frame liveness and Vulkan diagnostics.
    deps: [build-rust-shell]
    cmds:
      - >-
        {{.RUST_TASK}} stress

  build-rust-shell-smoke:
    desc: Link and stage the minimal Cargo runner against the matching engine.
    cmds:
      - '{{.RUST_TASK}} smoke'

  test-rust-shell:
    desc: Run Rust, C++ and Python shell checks on the current host.
    cmds:
      - '{{.RUST_TASK}} test'

  test-rust-shell-gpu:
    desc: Run hardware upload/readback, presentation-pass and shutdown tests under Vulkan validation.
    cmds:
      - '{{.RUST_TASK}} gpu-tests'

  test-rust-shell-text-input:
    desc: Validate native typing, Unicode clipboard, lifecycle and current-scale DPI.
    deps: [build-rust-shell]
    cmds:
      - '{{.RUST_TASK}} text-input'

  test-rust-shell-owned-windows:
    desc: Validate dialogs, satellites, reparenting and repeated view teardown.
    deps: [build-rust-shell]
    cmds:
      - '{{.RUST_TASK}} owned-windowing'

  test-rust-shell-tooltips:
    desc: Validate owned no-activate tooltips and parent teardown with rendered views.
    deps: [build-rust-shell]
    cmds:
      - '{{.RUST_TASK}} tooltip-windowing'
